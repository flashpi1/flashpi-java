name: OpenAPI sync

# Every day, downloads the public OpenAPI document of the Flashpi API
# (https://flashpi.com.ec/docs/openapi.json), regenerates the models in src/generated and, when
# something changed, checks the SDK still passes its checks, then opens (or updates) a pull request
# with the change.
#
# Two jobs, so the GitHub App's key never shares a runner with dependency code:
# - sync runs the generator and the checks (Maven and its plugins), with no secret and a read-only
#   GITHUB_TOKEN. It hands the contract and the generated models over as an artifact.
# - pull-request runs no repository or dependency code: it copies those files into a fresh
#   checkout and pushes and opens the PR with a token of the organization's GitHub App (the
#   FLASHPI_BOT_CLIENT_ID variable and FLASHPI_BOT_PRIVATE_KEY secret). A PR opened with the App's
#   token gets CI like any other; one opened with GITHUB_TOKEN would wait for approval.
on:
  schedule:
    - cron: '23 11 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openapi-sync
  cancel-in-progress: true

env:
  MAVEN_ARGS: --batch-mode --no-transfer-progress
  MODELS: src/generated/java/ec/com/flashpi/models

jobs:
  sync:
    name: Sync the API contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      checks: ${{ steps.checks.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Download the document and regenerate the models
        run: java scripts/OpenApi.java sync

      - name: Look for changes
        id: diff
        run: |
          git add --intent-to-add -- openapi "$MODELS"
          if git diff --quiet -- openapi "$MODELS"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- openapi "$MODELS"
          fi

      - name: Check the SDK with the new contract
        id: checks
        if: steps.diff.outputs.changed == 'true'
        continue-on-error: true
        run: |
          ./mvnw spotless:check
          ./mvnw verify
          ./mvnw spotbugs:check

      - name: Hand the new contract over
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contract
          path: |
            openapi/openapi.json
            src/generated/java/ec/com/flashpi/models/
          retention-days: 1

  pull-request:
    name: Open the pull request
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      BRANCH: chore/openapi-sync
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Outside the checkout, so nothing in the artifact can land in .git or next to the files.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: contract
          path: ${{ runner.temp }}/contract

      - name: Take the contract and the generated models, and nothing else
        env:
          CONTRACT: ${{ runner.temp }}/contract
        run: |
          set -euo pipefail
          if [ -L "$CONTRACT/openapi/openapi.json" ] || [ ! -f "$CONTRACT/openapi/openapi.json" ]; then
            echo "::error::The artifact has no regular file openapi/openapi.json"
            exit 1
          fi
          cp "$CONTRACT/openapi/openapi.json" openapi/openapi.json
          # Every generated model is a regular .java file that starts with the generator's marker.
          found="$(find "$CONTRACT/$MODELS" -mindepth 1)"
          for file in $found; do
            name="$(basename "$file")"
            if [ -L "$file" ] || [ ! -f "$file" ] || ! printf '%s' "$name" | grep -Eq '^[A-Za-z][A-Za-z0-9]*\.java$' \
              || ! head -1 "$file" | grep -q '^// GENERATED by scripts/OpenApi.java'; then
              echo "::error::The artifact holds ${file#"$CONTRACT/"}, which is not a generated model"
              exit 1
            fi
          done
          rm -f "$MODELS"/*.java
          cp "$CONTRACT/$MODELS"/*.java "$MODELS"/
          git add --intent-to-add -- openapi "$MODELS"
          git diff --stat -- openapi "$MODELS"

      # A one-hour token for this repository only: push the branch (contents) and open or edit the
      # PR (pull requests). It is revoked when the job ends.
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.FLASHPI_BOT_CLIENT_ID }}
          private-key: ${{ secrets.FLASHPI_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          BOT: ${{ steps.app-token.outputs.app-slug }}[bot]
          CHECKS: ${{ needs.sync.outputs.checks }}
        run: |
          bot_id=$(gh api "/users/${BOT}" --jq .id)
          git config user.name "$BOT"
          git config user.email "${bot_id}+${BOT}@users.noreply.github.com"
          git -c core.hooksPath=/dev/null switch -C "$BRANCH"
          git add --all -- openapi/openapi.json "$MODELS"
          git -c core.hooksPath=/dev/null commit -m "chore: sync the Flashpi API contract"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -c core.hooksPath=/dev/null -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            push --force "https://github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"
          if [ "$CHECKS" = success ]; then
            result="Formatting, Error Prone, tests, SpotBugs and the build passed with the new contract."
          else
            result="Formatting, Error Prone, tests, SpotBugs or the build FAILED with the new contract: see the workflow run. The SDK needs changes before this can merge."
          fi
          body="The public OpenAPI document of the Flashpi API changed. This updates openapi/openapi.json and the generated models.

          ${result}

          Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          Review new operations or fields: they may need a method (OperationsTest lists every operation) or a hand-written type in src/main/java."
          if gh pr view "$BRANCH" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$BRANCH" --body "$body"
          else
            gh pr create --head "$BRANCH" --title "chore: sync the Flashpi API contract" --body "$body"
          fi
